ral">MQTT fleet client</text><rect x="440.0" y="196.0" width="190.0" height="60.0" rx="8" fill="#fff" stroke="#124A5A" stroke-width="1.4"/><text x="535.0" y="216.0" font-size="13" fill="#124A5A" text-anchor="middle" font-weight="700" dominant-baseline="central">Nav2</text><text x="535.0" y="235.0" font-size="12" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">Smac Hybrid-A* · RPP</text><rect x="440.0" y="276.0" width="190.0" height="60.0" rx="8" fill="#fff" stroke="#124A5A" stroke-width="1.4"/><text x="535.0" y="288.0" font-size="13" fill="#124A5A" text-anchor="middle" font-weight="700" dominant-baseline="central">dock server</text><text x="535.0" y="307.0" font-size="12" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">RL policy (ONNX) 20 Hz</text><text x="535.0" y="323.0" font-size="12" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">classical fallback</text><rect x="440.0" y="356.0" width="190.0" height="46.0" rx="8" fill="#fff" stroke="#124A5A" stroke-width="1.4"/><text x="535.0" y="369.0" font-size="13" fill="#124A5A" text-anchor="middle" font-weight="700" dominant-baseline="central">lift server</text><text x="535.0" y="388.0" font-size="12" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">height target</text><rect x="665.0" y="196.0" width="160.0" height="140.0" rx="8" fill="#FFF7E0" stroke="#C98F12" stroke-width="1.4"/><text x="745.0" y="232.0" font-size="13" fill="#C98F12" text-anchor="middle" font-weight="700" dominant-baseline="central">safety supervisor</text><text x="745.0" y="251.0" font-size="12" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">clamps every source</text><text x="745.0" y="267.0" font-size="12" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">0.3 m/s · 0.1 docking</text><text x="745.0" y="283.0" font-size="12" fill="#3D4F58" text-anchor="mi