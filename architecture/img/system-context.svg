<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 866" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#124A5A"/>
    </marker>
    <style>
      .band{rx:12;stroke-width:1.5}
      .box{fill:#fff;stroke:#124A5A;stroke-width:1.4;rx:8}
      .acc{fill:#FFF7E0;stroke:#C98F12;stroke-width:1.4;rx:8}
      .t{fill:#124A5A;font-weight:700;font-size:14px}
      .s{fill:#3D4F58;font-size:12px}
      .b{fill:#124A5A;font-weight:700;font-size:16px}
      .lbl{fill:#5B6B73;font-size:12px;font-style:italic}
      .link{stroke:#124A5A;stroke-width:1.8;fill:none;marker-end:url(#ar)}
      .link2{stroke:#124A5A;stroke-width:1.8;fill:none;marker-start:url(#ar);marker-end:url(#ar)}
    </style>
  </defs>
  <rect width="1000" height="866" fill="#fff"/>

  <!-- Users -->
  <text x="500" y="30" class="b" text-anchor="middle">Smart Warehouse · Autonomous Forklift Fleet — system context</text>
  <rect class="box" x="60" y="50" width="200" height="54"/><text x="160" y="72" class="t" text-anchor="middle">Operator / admin</text><text x="160" y="92" class="s" text-anchor="middle">web dashboard, control room</text>
  <rect class="box" x="400" y="50" width="200" height="54"/><text x="500" y="72" class="t" text-anchor="middle">Floor worker</text><text x="500" y="92" class="s" text-anchor="middle">Flutter app on a phone</text>
  <rect class="box" x="740" y="50" width="200" height="54"/><text x="840" y="72" class="t" text-anchor="middle">Public / examiners</text><text x="840" y="92" class="s" text-anchor="middle">landing page</text>

  <!-- Layer 4: server -->
  <rect class="band" x="20" y="130" width="960" height="250" fill="#E8F2F5" stroke="#124A5A"/>
  <text x="36" y="154" class="b">Layer 4 · Fleet server</text>
  <text x="730" y="154" class="lbl" text-anchor="end">laptop on the warehouse LAN, or Railway (cloud demo)</text>
  <rect class="box" x="40" y="170" width="200" height="88"/><text x="140" y="192" class="t" text-anchor="middle">dashboard</text><text x="140" y="212" class="s" text-anchor="middle">React 19 + Vite + TS</text><text x="140" y="230" class="s" text-anchor="middle">live map, tasks, inventory,</text><text x="140" y="246" class="s" text-anchor="middle">analytics, manual drive</text>
  <rect class="box" x="400" y="170" width="200" height="88"/><text x="500" y="192" class="t" text-anchor="middle">mobile</text><text x="500" y="212" class="s" text-anchor="middle">Flutter, Riverpod</text><text x="500" y="230" class="s" text-anchor="middle">STOP ALL, alerts, fleet,</text><text x="500" y="246" class="s" text-anchor="middle">move pallet, drive</text>
  <rect class="box" x="760" y="170" width="200" height="88"/><text x="860" y="192" class="t" text-anchor="middle">landing</text><text x="860" y="212" class="s" text-anchor="middle">static React site, nginx</text><text x="860" y="230" class="s" text-anchor="middle">no API calls</text><text x="860" y="246" class="s" text-anchor="middle">"Open dashboard" link</text>

  <rect class="acc" x="40" y="282" width="560" height="84"/>
  <text x="320" y="304" class="t" text-anchor="middle">backend — FastAPI (Python 3.11)</text>
  <text x="320" y="324" class="s" text-anchor="middle">Fleet Manager: allocation (nearest / Hungarian) · lane graph A* · traffic locks · battery policy</text>
  <text x="320" y="342" class="s" text-anchor="middle">WMS: locations, pallets, tasks, events, moves · simulator · REST /api + WebSocket /ws/live (2 Hz)</text>
  <text x="320" y="358" class="s" text-anchor="middle">PostgreSQL (SQLite in dev) · Alembic migrations · JWT roles viewer / operator / admin</text>
  <rect class="box" x="660" y="282" width="300" height="84"/>
  <text x="810" y="304" class="t" text-anchor="middle">Mosquitto MQTT broker</text>
  <text x="810" y="324" class="s" text-anchor="middle">one login per robot + ACL (robot can only</text>
  <text x="810" y="342" class="s" text-anchor="middle">publish its own topics) · retained fleet E-stop</text>
  <text x="810" y="358" class="s" text-anchor="middle">Last Will → robot offline</text>

  <!-- links users -> clients -->
  <path class="link" d="M160 104 V170"/>
  <path class="link" d="M500 104 V170"/>
  <path class="link" d="M840 104 V170"/>
  <!-- clients -> backend -->
  <path class="link2" d="M140 258 V282"/>
  <path class="link2" d="M500 258 V282"/>
  <text x="150" y="274" class="lbl">HTTPS + WSS</text>
  <text x="510" y="274" class="lbl">HTTPS + WSS</text>
  <path class="link2" d="M600 324 H660"/>
  <text x="630" y="316" class="lbl" text-anchor="middle">MQTT</text>

  <!-- Wi-Fi link -->
  <path class="link2" d="M810 366 V430"/>
  <text x="798" y="394" class="lbl" text-anchor="end">Wi-Fi 5 GHz · MQTT JSON (schemas in docs/schemas)</text>
  <text x="798" y="412" class="lbl" text-anchor="end">↓ task · cmd · teleop · estop   ↑ state 2 Hz · task_status · event   ↕ traffic</text>

  <!-- Layer 3: Jetson -->
  <rect class="band" x="20" y="430" width="960" height="190" fill="#F3F0FA" stroke="#5B4A9A"/>
  <text x="36" y="454" class="b" fill="#4A3D85">Layer 3 · Jetson Orin Nano Super (×3) — ROS 2 Humble</text>
  <rect class="box" x="40" y="470" width="220" height="132"/><text x="150" y="492" class="t" text-anchor="middle">forklift_mission</text><text x="150" y="512" class="s" text-anchor="middle">behaviour tree</text><text x="150" y="530" class="s" text-anchor="middle">MQTT fleet client</text><text x="150" y="548" class="s" text-anchor="middle">lane requests / releases</text><text x="150" y="566" class="s" text-anchor="middle">server-loss handling</text>
  <rect class="box" x="280" y="470" width="210" height="132"/><text x="385" y="492" class="t" text-anchor="middle">forklift_navigation</text><text x="385" y="512" class="s" text-anchor="middle">RPLIDAR C1 → slam_toolbox</text><text x="385" y="530" class="s" text-anchor="middle">EKF (odom + IMU)</text><text x="385" y="548" class="s" text-anchor="middle">Nav2: Smac Hybrid-A*,</text><text x="385" y="566" class="s" text-anchor="middle">Regulated Pure Pursuit</text>
  <rect class="box" x="510" y="470" width="210" height="132"/><text x="615" y="492" class="t" text-anchor="middle">perception + rl</text><text x="615" y="512" class="s" text-anchor="middle">camera → ArUco pallet pose</text><text x="615" y="530" class="s" text-anchor="middle">YOLO person / obstacle</text><text x="615" y="548" class="s" text-anchor="middle">docking policy (ONNX,</text><text x="615" y="566" class="s" text-anchor="middle">20 Hz) + classical fallback</text>
  <rect class="acc" x="740" y="470" width="220" height="132"/><text x="850" y="492" class="t" text-anchor="middle">forklift_safety</text><text x="850" y="512" class="s" text-anchor="middle">supervisor: EVERY command</text><text x="850" y="530" class="s" text-anchor="middle">source passes here</text><text x="850" y="548" class="s" text-anchor="middle">0.3 m/s · 0.1 m/s docking</text><text x="850" y="566" class="s" text-anchor="middle">person &lt; 0.5 m → stop</text>
  <path class="link" d="M260 536 H280"/><path class="link" d="M490 536 H510"/><path class="link" d="M720 536 H740"/>

  <path class="link2" d="M850 602 V660"/>
  <text x="838" y="636" class="lbl" text-anchor="end">USB · micro-ROS: cmd_vel 20 Hz, heartbeat 10 Hz ↓ · odom, IMU, ToF, safety ↑</text>

  <!-- Layer 2: ESP32 -->
  <rect class="band" x="20" y="660" width="960" height="110" fill="#FDF3E3" stroke="#C98F12"/>
  <text x="36" y="684" class="b" fill="#8A5A1F">Layer 2 · ESP32-S3 firmware (FreeRTOS)</text>
  <rect class="acc" x="40" y="696" width="440" height="60"/><text x="260" y="718" class="t" text-anchor="middle">Core 1 · 1 kHz</text><text x="260" y="740" class="s" text-anchor="middle">safety state machine (ToF slow 40 cm / stop 15 cm, watchdog) · drive + lift PID</text>
  <rect class="box" x="500" y="696" width="460" height="60"/><text x="730" y="718" class="t" text-anchor="middle">Core 0</text><text x="730" y="740" class="s" text-anchor="middle">micro-ROS client · IMU 100 Hz (Madgwick) · battery INA219 · LEDs + buzzer</text>

  <!-- Layer 1 -->
  <rect class="band" x="20" y="786" width="960" height="66" fill="#F4F6F6" stroke="#7F8C8D"/>
  <text x="36" y="810" class="b" fill="#3D4F58">Layer 1 · Sensors, motors, power</text>
  <text x="36" y="828" class="s">drive + steering + lift motors · AS5600 wheel encoder · 6× VL53L1X ToF · MPU9250 IMU · slide pot + limit switches · TCRT5000 fork-tip sensors</text><text x="36" y="845" class="s">2S Li-ion + BMS · RPLIDAR C1 and camera (USB / CSI to the Jetson) · hardware E-Stop cuts motor power with no software involved</text>
</svg>
