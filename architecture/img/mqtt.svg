ight="400" dominant-baseline="central">Last Will on state:</text><text x="880.0" y="564.0" font-size="11.5" fill="#5B6B73" text-anchor="middle" font-weight="400" dominant-baseline="central">{"online": false}</text><text x="500.0" y="548.0" font-size="11.5" fill="#124A5A" text-anchor="middle" font-weight="400" dominant-baseline="central">Every message carries seq + UTC ts · no anonymous access</text><text x="500.0" y="564.0" font-size="11.5" fill="#124A5A" text-anchor="middle" font-weight="400" dominant-baseline="central">a robot may publish only its own topics (per-robot login + ACL)</text></svg>