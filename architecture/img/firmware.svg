<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="a3B5B92" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3B5B92"/></marker><marker id="a5B6B73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B6B73"/></marker><marker id="aC98F12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C98F12"/></marker><marker id="aB23A2E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B23A2E"/></marker><marker id="a124A5A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#124A5A"/></marker><marker id="a5B4A9A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B4A9A"/></marker><marker id="a2E8B57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2E8B57"/></marker></defs><rect width="1000" height="720" fill="#fff"/><text x="500.0" y="30.0" font-size="18" fill="#124A5A" text-anchor="middle" font-weight="700" dominant-baseline="central">ESP32-S3 firmware — two cores, one safety state machine</text><rect x="20.0" y="50.0" width="470.0" height="300.0" rx="12" fill="#FDF3E3" stroke="#C98F12" stroke-width="1.5"/><text x="36.0" y="72.0" font-size="15" fill="#C98F12" text-anchor="start" font-weight="700" dominant-baseline="central">Core 1 · real time</text><text x="474.0" y="72.0" font-size="12" fill="#5B6B73" text-anchor="end" font-weight="400" dominant-baseline="central" font-style="italic">hardware task watchdog 1 s</text><rect x="40.0" y="90.0" width="430.0" height="68.0" rx="8" fill="#fff" stroke="#C98F12" stroke-width="1.4"/><text x="56.0" y="110.0" font-size="13.5" fill="#124A5A" text-anchor="start" font-weight="700" dominant-baseline="central">safety_task</text><rect x="380.0" y="99.0" width="76.0" height="22.0" rx="11.0" fill="#FFF7E0" stroke="#C98F12" stroke-width="1.6"/><text x="418.0" y="110.0" font-size="11.5" fill="#C98F12" text-anchor="middle" font-weight="700" dominant-baseline="central">1 kHz</text><text x="56.0" y="136.0" font-size="11.5" fill="#3D4F58" text-anchor="start" font-weight="400" dominant-baseline="central">E-Stop, ToF, fork, battery, link times → state machine → speed cap</text><rect x="40.0" y="174.0" width="430.0" height="68.0" rx="8" fill="#fff" stroke="#C98F12" stroke-width="1.4"/><text x="56.0" y="194.0" font-size="13.5" fill="#124A5A" text-anchor="start" font-weight="700" dominant-baseline="central">motor_pid_task</text><rect x="380.0" y="183.0" width="76.0" height="22.0" rx="11.0" fill="#FFF7E0" stroke="#C98F12" stroke-width="1.6"/><text x="418.0" y="194.0" font-size="11.5" fill="#C98F12" text-anchor="middle" font-weight="700" dominant-baseline="central">1 kHz</text><text x="56.0" y="220.0" font-size="11.5" fill="#3D4F58" text-anchor="start" font-weight="400" dominant-baseline="central">encoder → drive PID · Ackermann → servo · lift · odometry</text><rect x="40.0" y="258.0" width="430.0" height="68.0" rx="8" fill="#fff" stroke="#C98F12" stroke-width="1.4"/><text x="56.0" y="278.0" font-size="13.5" fill="#124A5A" text-anchor="start" font-weight="700" dominant-baseline="central">tof_task</text><rect x="380.0" y="267.0" width="76.0" height="22.0" rx="11.0" fill="#FFF7E0" stroke="#C98F12" stroke-width="1.6"/><text x="418.0" y="278.0" font-size="11.5" fill="#C98F12" text-anchor="middle" font-weight="700" dominant-baseline="central">50 Hz</text><text x="56.0" y="304.0" font-size="11.5" fill="#3D4F58" text-anchor="start" font-weight="400" dominant-baseline="central">6 × VL53L1X through the mux, re-init a dropped sensor</text><rect x="510.0" y="50.0" width="470.0" height="300.0" rx="12" fill="#F4F6F6" stroke="#7F8C8D" stroke-width="1.5"/><text x="526.0" y="72.0" font-size="15" fill="#7F8C8D" text-anchor="start" font-weight="700" dominant-baseline="central">Core 0 · communication</text><rect x="530.0" y="90.0" width="430.0" height="68.0" rx="8" fill="#fff" stroke="#7F8C8D" stroke-width="1.4"/><text x="546.0" y="110.0" font-size="13.5" fill="#124A5A" text-anchor="start" font-weight="700" dominant-baseline="central">microros_task</text><rect x="870.0" y="99.0" width="76.0" height="22.0" rx="11.0" fill="#EEF1F1" stroke="#7F8C8D" stroke-width="1.6"/><text x="908.0" y="110.0" font-size="11.5" fill="#7F8C8D" text-anchor="middle" font-weight="700" dominant-baseline="central">event</text><text x="546.0" y="136.0" font-size="11.5" fill="#3D4F58" text-anchor="start" font-weight="400" dominant-baseline="central">ROS 2 topics to the Jetson, agent reconnect, gains</text><rect x="530.0" y="174.0" width="430.0" height="68.0" rx="8" fill="#fff" stroke="#7F8C8D" stroke-width="1.4"/><text x="546.0" y="194.0" font-size="13.5" fill="#124A5A" text-anchor="start" font-weight="700" dominant-baseline="central">imu_task</text><rect x="870.0" y="183.0" width="76.0" height="22.0" rx="11.0" fill="#EEF1F1" stroke="#7F8C8D" stroke-width="1.6"/><text x="908.0" y="194.0" font-size="11.5" fill="#7F8C8D" text-anchor="middle" font-weight="700" dominant-baseline="central">100 Hz</text><text x="546.0" y="220.0" font-size="11.5" fill="#3D4F58" text-anchor="start" font-weight="400" dominant-baseline="central">MPU9250 → bias removal → Madgwick filter</text><rect x="530.0" y="258.0" width="430.0" height="68.0" rx="8" fill="#fff" stroke="#7F8C8D" stroke-width="1.4"/><text x="546.0" y="278.0" font-size="13.5" fill="#124A5A" text-anchor="start" font-weight="700" dominant-baseline="central">status_task</text><rect x="870.0" y="267.0" width="76.0" height="22.0" rx="11.0" fill="#EEF1F1" stroke="#7F8C8D" stroke-width="1.6"/><text x="908.0" y="278.0" font-size="11.5" fill="#7F8C8D" text-anchor="middle" font-weight="700" dominant-baseline="central">10 Hz</text><text x="546.0" y="304.0" font-size="11.5" fill="#3D4F58" text-anchor="start" font-weight="400" dominant-baseline="central">INA219 → battery % · LED ring · buzzer</text><text x="500.0" y="372.0" font-size="15" fill="#124A5A" text-anchor="middle" font-weight="700" dominant-baseline="central">Safety state machine — checked every 1 ms, E-Stop first</text><rect x="40.0" y="470.0" width="120.0" height="40.0" rx="20.0" fill="#EEF1F1" stroke="#5B6B73" stroke-width="1.6"/><text x="100.0" y="490.0" font-size="13.5" fill="#5B6B73" text-anchor="middle" font-weight="700" dominant-baseline="central">BOOT</text><rect x="230.0" y="470.0" width="120.0" height="40.0" rx="20.0" fill="#fff" stroke="#124A5A" stroke-width="1.6"/><text x="290.0" y="490.0" font-size="13.5" fill="#124A5A" text-anchor="middle" font-weight="700" dominant-baseline="central">IDLE</text><rect x="430.0" y="470.0" width="120.0" height="40.0" rx="20.0" fill="#E3F4EA" stroke="#2E8B57" stroke-width="1.6"/><text x="490.0" y="490.0" font-size="13.5" fill="#2E8B57" text-anchor="middle" font-weight="700" dominant-baseline="central">ACTIVE</text><rect x="640.0" y="410.0" width="120.0" height="40.0" rx="20.0" fill="#FFF7E0" stroke="#C98F12" stroke-width="1.6"/><text x="700.0" y="430.0" font-size="13.5" fill="#C98F12" text-anchor="middle" font-weight="700" dominant-baseline="central">SLOW</text><rect x="640.0" y="530.0" width="120.0" height="40.0" rx="20.0" fill="#FBE7E4" stroke="#B23A2E" stroke-width="1.6"/><text x="700.0" y="550.0" font-size="13.5" fill="#B23A2E" text-anchor="middle" font-weight="700" dominant-baseline="central">STOP</text><rect x="230.0" y="610.0" width="120.0" height="40.0" rx="20.0" fill="#FBE7E4" stroke="#B23A2E" stroke-width="1.6"/><text x="290.0" y="630.0" font-size="13.5" fill="#B23A2E" text-anchor="middle" font-weight="700" dominant-baseline="central">SAFE</text><rect x="840.0" y="610.0" width="120.0" height="40.0" rx="20.0" fill="#B23A2E" stroke="#B23A2E" stroke-width="1.6"/><text x="900.0" y="630.0" font-size="13.5" fill="#fff" text-anchor="middle" font-weight="700" dominant-baseline="central">ESTOP</text><path d="M160.0 490.0 L230.0 490.0" fill="none" stroke="#124A5A" stroke-width="1.7" marker-end="url(#a124A5A)"/><rect x="125.1" y="449.0" width="89.9" height="18" rx="4" fill="#fff" opacity=".92"/><text x="170.0" y="458.0" font-size="11.5" fill="#5B6B73" text-anchor="middle" font-weight="400" dominant-baseline="central" font-style="italic">drivers ready</text><path d="M350.0 482.0 L430.0 482.0" fill="none" stroke="#124A5A" stroke-width="1.7" marker-end="url(#a124A5A)"/><rect x="345.1" y="457.0" width="89.9" height="18" rx="4" fill="#fff" opacity=".92"/><text x="390.0" y="466.0" font-size="11.5" fill="#5B6B73" text-anchor="middle" font-weight="400" dominant-baseline="central" font-style="italic">fresh cmd_vel</text><path d="M430.0 498.0 L350.0 498.0" fill="none" stroke="#124A5A" stroke-width="1.7" marker-end="url(#a124A5A)"/><rect x="363.9" y="505.0" width="52.1" height="18" rx="4" fill="#fff" opacity=".92"/><text x="390.0" y="514.0" font-size="11.5" fill="#5B6B73" text-anchor="middle" font-weight="400" dominant-baseline="central" font-style="italic">stopped</text><path d="M550.0 476.0 L600.0 430.0 L640.0 430.0" fill="none" stroke="#C98F12" stroke-width="1.7" marker-end="url(#aC98F12)"/><rect x="314.4" y="411.0" width="209.6" height="18" rx="4" fill="#fff" opacity=".92"/><text x="520.0" y="420.0" font-size="11.5" fill="#C98F12" text-anchor="end" font-weight="400" dominant-baseline="central" font-style="italic">ToF &lt; 40 cm · forks up · docking</text><path d="M550.0 500.0 L600.0 550.0 L640.0 550.0" fill="none" stroke="#B23A2E" stroke-width="1.7" marker-end="url(#aB23A2E)"/><rect x="552.5" y="563.0" width="115.1" height="18" rx="4" fill="#fff" opacity=".92"/><text x="610.0" y="572.0" font-size="11.5" fill="#B23A2E" text-anchor="middle" font-weight="400" dominant-baseline="central" font-style="italic">ToF &lt; 15 cm ahead</text><path d="M700.0 450.0 L700.0 530.0" fill="none" stroke="#B23A2E" stroke-width="1.7" marker-end="url(#aB23A2E)"/><path d="M290.0 510.0 L290.0 610.0" fill="none" stroke="#B23A2E" stroke-width="1.7" marker-end="url(#aB23A2E)"/><rect x="286.0" y="563.0" width="253.7" height="18" rx="4" fill="#fff" opacity=".92"/><text x="290.0" y="572.0" font-size="11.5" fill="#B23A2E" text-anchor="start" font-weight="400" dominant-baseline="central" font-style="italic">watchdog · battery &lt; 8 % · sensor fault</text><path d="M230.0 630.0 L100.0 630.0 L100.0 510.0" fill="none" stroke="#124A5A" stroke-width="1.7" marker-end="url(#a124A5A)"/><rect x="101.9" y="637.0" width="96.2" height="18" rx="4" fill="#fff" opacity=".92"/><text x="150.0" y="646.0" font-size="11.5" fill="#5B6B73" text-anchor="middle" font-weight="400" dominant-baseline="central" font-style="italic">cause gone 1 s</text><path d="M680.0 630.0 L840.0 630.0" fill="none" stroke="#B23A2E" stroke-width="1.7" marker-end="url(#aB23A2E)"/><rect x="711.9" y="605.0" width="96.2" height="18" rx="4" fill="#fff" opacity=".92"/><text x="760.0" y="614.0" font-size="11.5" fill="#B23A2E" text-anchor="middle" font-weight="400" dominant-baseline="central" font-style="italic">from ANY state</text><text x="900.0" y="666.0" font-size="12.5" fill="#B23A2E" text-anchor="middle" font-weight="700" dominant-baseline="central">E-Stop pressed</text><text x="980.0" y="690.0" font-size="11.5" fill="#B23A2E" text-anchor="end" font-weight="400" dominant-baseline="central" font-style="italic">latched: release + explicit reset → BOOT</text><text x="780.0" y="440.0" font-size="11" fill="#C98F12" text-anchor="start" font-weight="400" dominant-baseline="central">while docking the three front</text><text x="780.0" y="455.0" font-size="11" fill="#C98F12" text-anchor="start" font-weight="400" dominant-baseline="central">ToF are ignored (they see the</text><text x="780.0" y="470.0" font-size="11" fill="#C98F12" text-anchor="start" font-weight="400" dominant-baseline="central">pallet) and speed is capped</text></svg>