<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="a3B5B92" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3B5B92"/></marker><marker id="a5B6B73" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B6B73"/></marker><marker id="aC98F12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#C98F12"/></marker><marker id="aB23A2E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B23A2E"/></marker><marker id="a124A5A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#124A5A"/></marker><marker id="a5B4A9A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B4A9A"/></marker><marker id="a2E8B57" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2E8B57"/></marker></defs><rect width="1000" height="640" fill="#fff"/><text x="500.0" y="30.0" font-size="18" fill="#124A5A" text-anchor="middle" font-weight="700" dominant-baseline="central">Safety — four independent layers, the lowest one always wins</text><rect x="80.0" y="56.0" width="900.0" height="124.0" rx="12" fill="#E8F2F5" stroke="#124A5A" stroke-width="1.6"/><text x="100.0" y="82.0" font-size="15.5" fill="#124A5A" text-anchor="start" font-weight="700" dominant-baseline="central">1 · Fleet server</text><text x="100.0" y="104.0" font-size="12" fill="#5B6B73" text-anchor="start" font-weight="400" dominant-baseline="central" font-style="italic">warehouse-wide</text><circle cx="318" cy="86" r="3" fill="#124A5A"/><text x="328.0" y="86.0" font-size="12.5" fill="#3D4F58" text-anchor="start" font-weight="400" dominant-baseline="central">STOP ALL → retained E-stop, every robot holds zero speed</text><circle cx="318" cy="108" r="3" fill="#124A5A"/><text x="328.0" y="108.0" font-size="12.5" fill="#3D4F58" text-anchor="start" font-weight="400" dominant-baseline="central">battery low → go charge · critical → safe stop</text><circle cx="318" cy="130" r="3" fill="#124A5A"/><text x="328.0" y="130.0" font-size="12.5" fill="#3D4F58" text-anchor="start" font-weight="400" dominant-baseline="central">no state for 3 s → offline, unlifted task re-queued</text><circle cx="318" cy="152" r="3" fill="#124A5A"/><text x="328.0" y="152.0" font-size="12.5" fill="#3D4F58" text-anchor="start" font-weight="400" dominant-baseline="central">one robot per lane and node · teleop clamp + dead-man</text><rect x="820.0" y="102.0" width="144.0" height="30.0" rx="15.0" fill="#fff" stroke="#124A5A" stroke-width="1.6"/><text x="892.0" y="117.0" font-size="12" fill="#124A5A" text-anchor="middle" font-weight="700" dominant-baseline="central">next MQTT message</text><path d="M48.0 118.0 L48.0 258.0" fill="none" stroke="#124A5A" stroke-width="1.7" marker-end="url(#a124A5A)"/><rect x="80.0" y="196.0" width="900.0" height="124.0" rx="12" fill="#F3F0FA" stroke="#5B4A9A" stroke-width="1.6"/><text x="100.0" y="222.0" font-size="15.5" fill="#5B4A9A" text-anchor="start" font-weight="700" dominant-baseline="central">2 · Jetson supervisor</text><text x="100.0" y="244.0" font-size="12" fill="#5B6B73" text-anchor="start" font-weight="400" dominant-baseline="central" font-style="italic">per robot, software</text><circle cx="318" cy="226" r="3" fill="#5B4A9A"/><text x="328.0" y="226.0" font-size="12.5" fill="#3D4F58" text-anchor="start" font-weight="400" dominant-baseline="central">clamps Nav2, RL policy and teleop alike</text><circle cx="318" cy="248" r="3" fill="#5B4A9A"/><text x="328.0" y="248.0" font-size="12.5" fill="#3D4F58" text-anchor="start" font-weight="400" dominant-baseline="central">0.3 m/s · 0.1 m/s with forks &gt; 5 cm or docking</text><circle cx="318" cy="270" r="3" fill="#5B4A9A"/><text x="328.0" y="270.0" font-size="12.5" fill="#3D4F58" text-anchor="start" font-weight="400" dominant-baseline="central">person (YOLO) &lt; 1 m slow · &lt; 0.5 m stop</text><circle cx="318" cy="292" r="3" fill="#5B4A9A"/><text x="328.0" y="292.0" font-size="12.5" fill="#3D4F58" text-anchor="start" font-weight="400" dominant-baseline="central">server lost &gt; 3 s → finish the step, then stop</text><rect x="820.0" y="242.0" width="144.0" height="30.0" rx="15.0" fill="#fff" stroke="#5B4A9A" stroke-width="1.6"/><text x="892.0" y="257.0" font-size="12" fill="#5B4A9A" text-anchor="middle" font-weight="700" dominant-baseline="central">20 Hz command loop</text><path d="M48.0 258.0 L48.0 398.0" fill="none" stroke="#5B4A9A" stroke-width="1.7" marker-end="url(#a5B4A9A)"/><rect x="80.0" y="336.0" width="900.0" height="124.0" rx="12" fill="#FFF7E0" stroke="#C98F12" stroke-width="1.6"/><text x="100.0" y="362.0" font-size="15.5" fill="#C98F12" text-anchor="start" font-weight="700" dominant-baseline="central">3 · ESP32 safety loop</text><text x="100.0" y="384.0" font-size="12" fill="#5B6B73" text-anchor="start" font-weight="400" dominant-baseline="central" font-style="italic">per robot, real time</text><circle cx="318" cy="366" r="3" fill="#C98F12"/><text x="328.0" y="366.0" font-size="12.5" fill="#3D4F58" text-anchor="start" font-weight="400" dominant-baseline="central">ToF ahead &lt; 40 cm slow · &lt; 15 cm stop</text><circle cx="318" cy="388" r="3" fill="#C98F12"/><text x="328.0" y="388.0" font-size="12.5" fill="#3D4F58" text-anchor="start" font-weight="400" dominant-baseline="central">heartbeat missing → SAFE, motors stop (≈ 560 ms, ≤ 600 ms required)</text><circle cx="318" cy="410" r="3" fill="#C98F12"/><text x="328.0" y="410.0" font-size="12.5" fill="#3D4F58" text-anchor="start" font-weight="400" dominant-baseline="central">battery &lt; 8 % · sensor fault → SAFE</text><circle cx="318" cy="432" r="3" fill="#C98F12"/><text x="328.0" y="432.0" font-size="12.5" fill="#3D4F58" text-anchor="start" font-weight="400" dominant-baseline="central">safety output &gt; 5 ms old → motor task brakes · watchdog 1 s</text><rect x="820.0" y="382.0" width="144.0" height="30.0" rx="15.0" fill="#fff" stroke="#C98F12" stroke-width="1.6"/><text x="892.0" y="397.0" font-size="12" fill="#C98F12" text-anchor="middle" font-weight="700" dominant-baseline="central">1 kHz, every 1 ms</text><path d="M48.0 398.0 L48.0 538.0" fill="none" stroke="#C98F12" stroke-width="1.7" marker-end="url(#aC98F12)"/><rect x="80.0" y="476.0" width="900.0" height="124.0" rx="12" fill="#FBE7E4" stroke="#B23A2E" stroke-width="1.6"/><text x="100.0" y="502.0" font-size="15.5" fill="#B23A2E" text-anchor="start" font-weight="700" dominant-baseline="central">4 · Hardware E-Stop</text><text x="100.0" y="524.0" font-size="12" fill="#5B6B73" text-anchor="start" font-weight="400" dominant-baseline="central" font-style="italic">per robot, no software</text><circle cx="318" cy="506" r="3" fill="#B23A2E"/><text x="328.0" y="506.0" font-size="12.5" fill="#3D4F58" text-anchor="start" font-weight="400" dominant-baseline="central">normally-closed button in the motor power branch</text><circle cx="318" cy="528" r="3" fill="#B23A2E"/><text x="328.0" y="528.0" font-size="12.5" fill="#3D4F58" text-anchor="start" font-weight="400" dominant-baseline="central">cuts the motors; Jetson and ESP32 stay on and report</text><circle cx="318" cy="550" r="3" fill="#B23A2E"/><text x="328.0" y="550.0" font-size="12.5" fill="#3D4F58" text-anchor="start" font-weight="400" dominant-baseline="central">latched: release + explicit reset to drive again</text><rect x="820.0" y="522.0" width="144.0" height="30.0" rx="15.0" fill="#fff" stroke="#B23A2E" stroke-width="1.6"/><text x="892.0" y="537.0" font-size="12" fill="#B23A2E" text-anchor="middle" font-weight="700" dominant-baseline="central">instant</text><text x="48.0" y="40.0" font-size="11" fill="#5B6B73" text-anchor="middle" font-weight="400" dominant-baseline="central" font-style="italic">commands</text><circle cx="48" cy="118" r="6" fill="#124A5A"/><text x="530.0" y="626.0" font-size="12" fill="#124A5A" text-anchor="middle" font-weight="400" dominant-baseline="central" font-style="italic">Every command, from the dashboard, Nav2, the RL policy or the gamepad, passes every layer below it. A lower layer never trusts the one above.</text></svg>