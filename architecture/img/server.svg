" width="135.0" height="52.0" rx="8" fill="#F3F0FA" stroke="#5B4A9A" stroke-width="1.4"/><text x="892.5" y="356.0" font-size="12.5" fill="#5B4A9A" text-anchor="middle" font-weight="700" dominant-baseline="central">Forklift fl3</text><text x="892.5" y="375.0" font-size="12" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">Jetson + ESP32</text><path d="M892.0 470.0 L892.0 392.0" fill="none" stroke="#124A5A" stroke-width="1.7" marker-end="url(#a124A5A)" marker-start="url(#a124A5A)"/><rect x="850.2" y="431.0" width="83.6" height="18" rx="4" fill="#fff" opacity=".92"/><text x="892.0" y="440.0" font-size="11.5" fill="#5B6B73" text-anchor="middle" font-weight="400" dominant-baseline="central" font-style="italic">Wi-Fi · MQTT</text></svg>