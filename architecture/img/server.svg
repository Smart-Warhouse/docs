5A)"/><text x="590.0" y="247.0" font-size="11" fill="#5B6B73" text-anchor="start" font-weight="400" dominant-baseline="central" font-style="italic">push</text><rect x="40.0" y="470.0" width="170.0" height="66.0" rx="8" fill="#FFF7E0" stroke="#C98F12" stroke-width="1.4"/><text x="125.0" y="485.0" font-size="12.5" fill="#C98F12" text-anchor="middle" font-weight="700" dominant-baseline="central">warehouse_map.yaml</text><text x="125.0" y="504.0" font-size="12" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">lane graph · zones</text><text x="125.0" y="520.0" font-size="12" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">locations · robots</text><rect x="240.0" y="470.0" width="230.0" height="66.0" rx="8" fill="#fff" stroke="#124A5A" stroke-width="1.4"/><text x="355.0" y="485.0" font-size="13" fill="#124A5A" text-anchor="middle" font-weight="700" dominant-baseline="central">PostgreSQL</text><text x="355.0" y="504.0" font-size="12" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">WMS tables · Alembic</text><text x="355.0" y="520.0" font-size="12" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">robots saved every 2 s</text><rect x="500.0" y="470.0" width="260.0" height="66.0" rx="8" fill="#fff" stroke="#124A5A" stroke-width="1.4"/><text x="630.0" y="485.0" font-size="13" fill="#124A5A" text-anchor="middle" font-weight="700" dominant-baseline="central">MQTT bridge (aiomqtt)</text><text x="630.0" y="504.0" font-size="12" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">robot topics in → manager</text><text x="630.0" y="520.0" font-size="12" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">manager outbox → broker</text><path d="M125.0 470.0 L125.0 434.0" fill="none" stroke="#124A5A" stroke-width="1.7" marker-end="url(#a124A5A)"/><path d="M355.0 470.0 L355.0 434.0" fill="none" st