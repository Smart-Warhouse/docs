middle" font-weight="700" dominant-baseline="central">MuJoCo env</text><text x="140.0" y="135.0" font-size="11.5" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">1:14 forklift + pallet</text><text x="140.0" y="151.0" font-size="11.5" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">randomised friction, delay,</text><text x="140.0" y="167.0" font-size="11.5" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">marker noise, load</text><path d="M240.0 142.0 L276.0 142.0" fill="none" stroke="#124A5A" stroke-width="1.7" marker-end="url(#a124A5A)"/><rect x="276.0" y="86.0" width="200.0" height="112.0" rx="8" fill="#fff" stroke="#124A5A" stroke-width="1.4"/><text x="376.0" y="124.0" font-size="13.5" fill="#124A5A" text-anchor="middle" font-weight="700" dominant-baseline="central">Imitation</text><text x="376.0" y="143.0" font-size="11.5" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">clone the classical</text><text x="376.0" y="159.0" font-size="11.5" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">controller first</text><path d="M476.0 142.0 L512.0 142.0" fill="none" stroke="#124A5A" stroke-width="1.7" marker-end="url(#a124A5A)"/><rect x="512.0" y="86.0" width="200.0" height="112.0" rx="8" fill="#fff" stroke="#124A5A" stroke-width="1.4"/><text x="612.0" y="124.0" font-size="13.5" fill="#124A5A" text-anchor="middle" font-weight="700" dominant-baseline="central">Conservative PPO</text><text x="612.0" y="143.0" font-size="11.5" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">lr 3·10⁻⁵ · clip 0.1</text><text x="612.0" y="159.0" font-size="11.5" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">target KL 0.01</text><path d="M712.0 142.0 L748.0 142.0" fill="none" stroke="#124A5A" stroke-width="1.7" marker-end="url(#a124A5A)"/><rect x="748.0" y="86.0" width="200.0" height="112.0" rx="8" fill="#fff" stroke="#124A5A" stroke-width="1.4"/><text x="848.0" y="124.0" font-size="13.5" fill="#124A5A" text-anchor="middle" font-weight="700" dominant-baseline="central">Checkpoint pick</text><text x="848.0" y="143.0" font-size="11.5" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">best on validation seeds</text><text x="848.0" y="159.0" font-size="11.5" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">(625 k steps)</text><rect x="20.0" y="236.0" width="960.0" height="140.0" rx="12" fill="#F3F0FA" stroke="#5B4A9A" stroke-width="1.5"/><text x="36.0" y="258.0" font-size="15" fill="#5B4A9A" text-anchor="start" font-weight="700" dominant-baseline="central">On the robot (Jetson)</text><rect x="40.0" y="272.0" width="200.0" height="84.0" rx="8" fill="#fff" stroke="#5B4A9A" stroke-width="1.4"/><text x="140.0" y="304.0" font-size="13.5" fill="#5B4A9A" text-anchor="middle" font-weight="700" dominant-baseline="central">ONNX export</text><text x="140.0" y="323.0" font-size="11.5" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">→ TensorRT FP16</text><path d="M240.0 314.0 L276.0 314.0" fill="none" stroke="#124A5A" stroke-width="1.7" marker-end="url(#a124A5A)"/><rect x="276.0" y="272.0" width="200.0" height="84.0" rx="8" fill="#fff" stroke="#5B4A9A" stroke-width="1.4"/><text x="376.0" y="296.0" font-size="13.5" fill="#5B4A9A" text-anchor="middle" font-weight="700" dominant-baseline="central">dock server</text><text x="376.0" y="315.0" font-size="11.5" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">policy at 20 Hz</text><text x="376.0" y="331.0" font-size="11.5" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">ArUco pallet pose in</text><path d="M476.0 314.0 L512.0 314.0" fill="none" stroke="#124A5A" stroke-width="1.7" marker-end="url(#a124A5A)"/><rect x="512.0" y="272.0" width="200.0" height="84.0" rx="8" fill="#FFF7E0" stroke="#C98F12" stroke-width="1.4"/><text x="612.0" y="304.0" font-size="13.5" fill="#C98F12" text-anchor="middle" font-weight="700" dominant-baseline="central">safety supervisor</text><text x="612.0" y="323.0" font-size="11.5" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">caps 0.1 m/s while docking</text><path d="M712.0 314.0 L748.0 314.0" fill="none" stroke="#124A5A" stroke-width="1.7" marker-end="url(#a124A5A)"/><rect x="748.0" y="272.0" width="200.0" height="84.0" rx="8" fill="#FFF7E0" stroke="#C98F12" stroke-width="1.4"/><text x="848.0" y="304.0" font-size="13.5" fill="#C98F12" text-anchor="middle" font-weight="700" dominant-baseline="central">ESP32</text><text x="848.0" y="323.0" font-size="11.5" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">1 kHz safety loop</text><path d="M848.0 198.0 L848.0 228.0 L224.0 228.0 L224.0 272.0" fill="none" stroke="#5B6B73" stroke-width="1.7" marker-end="url(#a5B6B73)"/><text x="40.0" y="410.0" font-size="15" fill="#124A5A" text-anchor="start" font-weight="700" dominant-baseline="central">Result on 1000 randomised episodes (with the safety supervisor)</text><text x="40.0" y="440.0" font-size="13" fill="#3D4F58" text-anchor="start" font-weight="700" dominant-baseline="central">Docked</text><text x="40.0" y="474.0" font-size="12" fill="#3D4F58" text-anchor="start" font-weight="400" dominant-baseline="central">classical controller</text><rect x="190.0" y="462.0" width="234.0" height="24.0" rx="4" fill="#8FA3AB" stroke="#8FA3AB" stroke-width="1"/><text x="432.0" y="474.0" font-size="13" fill="#8FA3AB" text-anchor="start" font-weight="700" dominant-baseline="central">90 %</text><text x="40.0" y="514.0" font-size="12" fill="#3D4F58" text-anchor="start" font-weight="400" dominant-baseline="central">RL policy</text><rect x="190.0" y="502.0" width="256.6" height="24.0" rx="4" fill="#2E8B57" stroke="#2E8B57" stroke-width="1"/><text x="454.6" y="514.0" font-size="13" fill="#2E8B57" text-anchor="start" font-weight="700" dominant-baseline="central">98.7 %</text><text x="520.0" y="440.0" font-size="13" fill="#3D4F58" text-anchor="start" font-weight="700" dominant-baseline="central">Mean time to dock</text><text x="520.0" y="474.0" font-size="12" fill="#3D4F58" text-anchor="start" font-weight="400" dominant-baseline="central">classical controller</text><rect x="670.0" y="462.0" width="243.5" height="24.0" rx="4" fill="#8FA3AB" stroke="#8FA3AB" stroke-width="1"/><text x="921.5" y="474.0" font-size="13" fill="#8FA3AB" text-anchor="start" font-weight="700" dominant-baseline="central">10.3 s</text><text x="520.0" y="514.0" font-size="12" fill="#3D4F58" text-anchor="start" font-weight="400" dominant-baseline="central">RL policy</text><rect x="670.0" y="502.0" width="153.6" height="24.0" rx="4" fill="#2E8B57" stroke="#2E8B57" stroke-width="1"/><text x="831.6" y="514.0" font-size="13" fill="#2E8B57" text-anchor="start" font-weight="700" dominant-baseline="central">6.5 s</text><text x="40.0" y="548.0" font-size="12" fill="#5B6B73" text-anchor="start" font-weight="400" dominant-baseline="central" font-style="italic">Collisions: 0 % classical, 1.3 % RL — the classical controller stays as the fallback.</text><rect x="40.0" y="576.0" width="940.0" height="100.0" rx="10" fill="#E8F2F5" stroke="#124A5A" stroke-width="1.4"/><text x="60.0" y="600.0" font-size="14" fill="#124A5A" text-anchor="start" font-weight="700" dominant-baseline="central">Task allocation (fleet server)</text><text x="60.0" y="626.0" font-size="12.5" fill="#3D4F58" text-anchor="start" font-weight="400" dominant-baseline="central">Hungarian (optimal assignment) vs nearest robot · 270 runs, 15 seeds, 2–4 robots, 3 task rates</text><text x="60.0" y="652.0" font-size="12.5" fill="#3D4F58" text-anchor="start" font-weight="400" dominant-baseline="central">Same at low load; when the fleet is saturated, Hungarian moves 53–67 % more tasks per hour.</text><rect x="830.0" y="612.0" width="130.0" height="30.0" rx="15.0" fill="#fff" stroke="#2E8B57" stroke-width="1.6"/><text x="895.0" y="627.0" font-size="13" fill="#2E8B57" text-anchor="middle" font-weight="700" dominant-baseline="central">+53–67 % tasks/h</text></svg>