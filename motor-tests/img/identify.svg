<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="Segoe UI, Arial, sans-serif"><rect width="1000" height="330" fill="#fff"/><text x="500.0" y="28" font-size="17" fill="#124A5A" text-anchor="middle" font-weight="700" dominant-baseline="central">Step 1 — what kind of motor is it? Count the wires</text><rect x="30" y="56" width="300" height="250" rx="12" fill="#fff" stroke="#124A5A" stroke-width="1.5"/><text x="180" y="82" font-size="16" fill="#124A5A" text-anchor="middle" font-weight="700" dominant-baseline="central">DC motor</text><text x="180" y="104" font-size="13" fill="#5B6B73" text-anchor="middle" font-weight="400" dominant-baseline="central">2 wires</text><circle cx="110" cy="170" r="34" fill="#EEF1F1" stroke="#124A5A" stroke-width="2"/><text x="110" y="170" font-size="20" fill="#124A5A" text-anchor="middle" font-weight="700" dominant-baseline="central">M</text><path d="M144 150.0 L230 150.0" fill="none" stroke="#C0392B" stroke-width="3" stroke-linejoin="round"/><path d="M144 190.0 L230 190.0" fill="none" stroke="#222" stroke-width="3" stroke-linejoin="round"/><rect x="226" y="140" width="26" height="60" rx="3" fill="#fff" stroke="#5B6B73" stroke-width="1.5"/><text x="180" y="228" font-size="12" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">Drive, lift and side-shift</text><text x="180" y="246" font-size="12" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">are usually this type.</text><text x="180" y="264" font-size="12" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">Reverses when you swap</text><text x="180" y="282" font-size="12" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">the two wires.</text><rect x="350" y="56" width="300" height="250" rx="12" fill="#fff" stroke="#124A5A" stroke-width="1.5"/><text x="500" y="82" font-size="16" fill="#124A5A" text-anchor="middle" font-weight="700" dominant-baseline="central">Servo</text><text x="500" y="104" font-size="13" fill="#5B6B73" text-anchor="middle" font-weight="400" dominant-baseline="central">3 wires</text><circle cx="430" cy="170" r="34" fill="#EEF1F1" stroke="#124A5A" stroke-width="2"/><text x="430" y="170" font-size="20" fill="#124A5A" text-anchor="middle" font-weight="700" dominant-baseline="central">S</text><path d="M464 150.0 L550 150.0" fill="none" stroke="#222" stroke-width="3" stroke-linejoin="round"/><path d="M464 170.0 L550 170.0" fill="none" stroke="#C0392B" stroke-width="3" stroke-linejoin="round"/><path d="M464 190.0 L550 190.0" fill="none" stroke="#E6A817" stroke-width="3" stroke-linejoin="round"/><rect x="546" y="140" width="26" height="60" rx="3" fill="#fff" stroke="#5B6B73" stroke-width="1.5"/><text x="500" y="228" font-size="12" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">Brown/black = GND</text><text x="500" y="246" font-size="12" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">red = + (4.8–6 V)</text><text x="500" y="264" font-size="12" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">orange/yellow/white = signal</text><text x="500" y="282" font-size="12" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">Do NOT put battery V on signal.</text><rect x="670" y="56" width="300" height="250" rx="12" fill="#fff" stroke="#124A5A" stroke-width="1.5"/><text x="820" y="82" font-size="16" fill="#124A5A" text-anchor="middle" font-weight="700" dominant-baseline="central">DC + feedback pot</text><text x="820" y="104" font-size="13" fill="#5B6B73" text-anchor="middle" font-weight="400" dominant-baseline="central">5 wires</text><circle cx="750" cy="170" r="34" fill="#EEF1F1" stroke="#124A5A" stroke-width="2"/><text x="750" y="170" font-size="20" fill="#124A5A" text-anchor="middle" font-weight="700" dominant-baseline="central">M</text><path d="M784 150.0 L870 150.0" fill="none" stroke="#C0392B" stroke-width="3" stroke-linejoin="round"/><path d="M784 160.0 L870 160.0" fill="none" stroke="#222" stroke-width="3" stroke-linejoin="round"/><path d="M784 170.0 L870 170.0" fill="none" stroke="#888" stroke-width="3" stroke-linejoin="round"/><path d="M784 180.0 L870 180.0" fill="none" stroke="#888" stroke-width="3" stroke-linejoin="round"/><path d="M784 190.0 L870 190.0" fill="none" stroke="#888" stroke-width="3" stroke-linejoin="round"/><rect x="866" y="140" width="26" height="60" rx="3" fill="#fff" stroke="#5B6B73" stroke-width="1.5"/><text x="820" y="228" font-size="12" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">2 thick = motor</text><text x="820" y="246" font-size="12" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">3 thin = potentiometer</text><text x="820" y="264" font-size="12" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">(the angle sensor).</text><text x="820" y="282" font-size="12" fill="#3D4F58" text-anchor="middle" font-weight="400" dominant-baseline="central">Common for RC toy steering.</text></svg>