ke-linejoin="round"/><path d="M330 90 L450 90" fill="none" stroke="#C0392B" stroke-width="3" stroke-linejoin="round"/><path d="M140 182 L170 182 L170 240 L430 240 L430 180 L450 180" fill="none" stroke="#222" stroke-width="3" stroke-linejoin="round"/><path d="M620 90 L700 90" fill="none" stroke="#124A5A" stroke-width="2" stroke-linejoin="round"/><circle cx="725" cy="90" r="16" fill="#EEF1F1" stroke="#124A5A" stroke-width="1.5"/><text x="725" y="90" font-size="12" fill="#124A5A" text-anchor="middle" font-weight="700" dominant-baseline="central">M</text><text x="752" y="90" font-size="12.5" fill="#3D4F58" text-anchor="start" font-weight="400" dominant-baseline="central">drive</text><path d="M620 125 L700 125" fill="none" stroke="#124A5A" stroke-width="2" stroke-linejoin="round"/><circle cx="725" cy="125" r="16" fill="#EEF1F1" stroke="#124A5A" stroke-width="1.5"/><text x="725" y="125" font-size="12" fill="#124A5A" text-anchor="middle" font-weight="700" dominant-baseline="central">M</text><text x="752" y="125" font-size="12.5" fill="#3D4F58" text-anchor="start" font-weight="400" dominant-baseline="central">steering</text><path d="M620 160 L700 160" fill="none" stroke="#124A5A" stroke-width="2" stroke-linejoin="round"/><circle cx="725" cy="160" r="16" fill="#EEF1F1" stroke="#124A5A" stroke-width="1.5"/><text x="725" y="160" font-size="12" fill="#124A5A" text-anchor="middle" font-weight="700" dominant-baseline="central">M</text><text x="752" y="160" font-size="12.5" fill="#3D4F58" text-anchor="start" font-weight="400" dominant-baseline="central">lift</text><path d="M620 195 L700 195" fill="none" stroke="#124A5A" stroke-width="2" stroke-linejoin="round"/><circle cx="725" cy="195" r="16" fill="#EEF1F1" stroke="#124A5A" stroke-width="1.5"/><text x="725" y="195" font-size="12" fill="#124A5A" text-anchor="middle" font-weight="700" dominant-baseline="central">M</text><text x="752" y="195" font-size="12.5" fill="#3D4F58" text-anchor="start" font-weight="400" dominant-baseline="central">side-shift</text><rect x="40" y="268" width="920" height="54" rx="8" fill="#FFF7E0" stroke="#C98F12" stroke-width="1.5"/><text x="52" y="286" font-size="12.5" fill="#C98F12" text-anchor="start" font-weight="700" dominant-baseline="central">Reading  =  board idle current  +  the one motor you are using.   Motor current  =  reading − idle.</text><text x="52" y="304" font-size="12.5" fill="#C98F12" text-anchor="start" font-weight="400" dominant-baseline="central">Use the remote to run ONE function at a time. Good first test: shows the original behaviour, risk-free.</text></svg>