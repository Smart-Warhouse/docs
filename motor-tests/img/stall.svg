<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="Segoe UI, Arial, sans-serif"><rect width="1000" height="300" fill="#fff"/><text x="500.0" y="28" font-size="17" fill="#124A5A" text-anchor="middle" font-weight="700" dominant-baseline="central">Step 5 — stall current: block the motor for at most 2 seconds</text><circle cx="200" cy="150" r="34" fill="#EEF1F1" stroke="#124A5A" stroke-width="2"/><text x="200" y="150" font-size="22" fill="#124A5A" text-anchor="middle" font-weight="700" dominant-baseline="central">M</text><rect x="250" y="110" width="40" height="80" rx="4" fill="#B9843F" stroke="#5A3A12" stroke-width="2"/><text x="270" y="210" font-size="12" fill="#5B6B73" text-anchor="middle" font-weight="400" dominant-baseline="central">wheel held</text><text x="360" y="140" font-size="30" fill="#B23A2E" text-anchor="middle" font-weight="700" dominant-baseline="central">≤ 2 s</text><text x="360" y="172" font-size="12" fill="#B23A2E" text-anchor="middle" font-weight="400" dominant-baseline="central">then let go</text><rect x="450" y="60" width="520" height="108" rx="8" fill="#FFF7E0" stroke="#C98F12" stroke-width="1.5"/><text x="462" y="78" font-size="12.5" fill="#C98F12" text-anchor="start" font-weight="700" dominant-baseline="central">How</text><text x="462" y="96" font-size="12.5" fill="#C98F12" text-anchor="start" font-weight="400" dominant-baseline="central">1. Meter in series (step 4), 10A socket, lift the wheels off the floor.</text><text x="462" y="114" font-size="12.5" fill="#C98F12" text-anchor="start" font-weight="400" dominant-baseline="central">2. Start the motor, then grip the wheel / hold the shaft until it stops.</text><text x="462" y="132" font-size="12.5" fill="#C98F12" text-anchor="start" font-weight="400" dominant-baseline="central">3. Read the number within 1–2 s, then let go. Wait 30 s between tries.</text><text x="462" y="150" font-size="12.5" fill="#C98F12" text-anchor="start" font-weight="400" dominant-baseline="central">4. Repeat 3 times, keep the highest.</text><rect x="450" y="200" width="520" height="36" rx="8" fill="#FBE7E4" stroke="#B23A2E" stroke-width="1.5"/><text x="462" y="218" font-size="12.5" fill="#B23A2E" text-anchor="start" font-weight="700" dominant-baseline="central">Not for the lift at its end stop · not for the servo · not if it smokes</text></svg>