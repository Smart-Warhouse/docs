<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" font-family="Segoe UI, Arial, sans-serif"><rect width="1000" height="330" fill="#fff"/><text x="500.0" y="28" font-size="17" fill="#124A5A" text-anchor="middle" font-weight="700" dominant-baseline="central">Step 2 — winding resistance (motor disconnected, no battery anywhere)</text><circle cx="250" cy="170" r="34" fill="#EEF1F1" stroke="#124A5A" stroke-width="2"/><text x="250" y="170" font-size="22" fill="#124A5A" text-anchor="middle" font-weight="700" dominant-baseline="central">M</text><text x="250" y="220" font-size="12" fill="#5B6B73" text-anchor="middle" font-weight="400" dominant-baseline="central">motor terminals</text><rect x="520" y="110" width="110" height="120" rx="10" fill="#FFF7C2" stroke="#7A6512" stroke-width="1.5"/><rect x="532" y="122" width="86" height="34" rx="4" fill="#E9F2D8" stroke="#7A6512" stroke-width="1.5"/><text x="575" y="139" font-size="16" fill="#3B4A1A" text-anchor="middle" font-weight="700" dominant-baseline="central">Ω  200</text><text x="575" y="182" font-size="11" fill="#7A6512" text-anchor="middle" font-weight="400" dominant-baseline="central">multimeter</text><text x="575" y="206" font-size="11" fill="#7A6512" text-anchor="middle" font-weight="700" dominant-baseline="central">COM · VΩ</text><path d="M284 160 L420 160 L420 140 L520 140" fill="none" stroke="#C0392B" stroke-width="3" stroke-linejoin="round"/><path d="M284 180 L440 180 L440 200 L520 200" fill="none" stroke="#222" stroke-width="3" stroke-linejoin="round"/><circle cx="284" cy="160" r="4" fill="#C0392B"/><circle cx="284" cy="180" r="4" fill="#222"/><rect x="680" y="70" width="300" height="162" rx="8" fill="#FFF7E0" stroke="#C98F12" stroke-width="1.5"/><text x="692" y="88" font-size="12.5" fill="#C98F12" text-anchor="start" font-weight="700" dominant-baseline="central">Why this first</text><text x="692" y="106" font-size="12.5" fill="#C98F12" text-anchor="start" font-weight="400" dominant-baseline="central">Safe: no current flows.</text><text x="692" y="124" font-size="12.5" fill="#C98F12" text-anchor="start" font-weight="400" dominant-baseline="central">Stall current ≈ V ÷ R</text><text x="692" y="142" font-size="12.5" fill="#C98F12" text-anchor="start" font-weight="400" dominant-baseline="central">e.g. 8.4 V ÷ 2.0 Ω ≈ 4.2 A</text><text x="692" y="160" font-size="12.5" fill="#C98F12" text-anchor="start" font-weight="400" dominant-baseline="central">Turn the shaft slowly; write</text><text x="692" y="178" font-size="12.5" fill="#C98F12" text-anchor="start" font-weight="400" dominant-baseline="central">the LOWEST and highest value.</text><text x="692" y="196" font-size="12.5" fill="#C98F12" text-anchor="start" font-weight="400" dominant-baseline="central">Touch the probes together first:</text><text x="692" y="214" font-size="12.5" fill="#C98F12" text-anchor="start" font-weight="400" dominant-baseline="central">subtract that lead resistance.</text><text x="250" y="270" font-size="12" fill="#B23A2E" text-anchor="middle" font-weight="400" dominant-baseline="central" font-style="italic">Unsolder or unplug the motor from the toy's board first</text></svg>